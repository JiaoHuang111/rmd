mode: crystal
name: dmlm_150m
train:
  train: true
  test: true
  debug: false
  force_restart: false
  ckpt_path: last.ckpt
  seed: 42
  lr: 0.001
  monitor: val/loss
  mode: min
  patience: 1000
  val_and_save_every_n_steps: null
tokenizer:
  type: crystallm
  meta_file: data-bin/crystalmols/meta.pkl
  vocab_size: 371
print_config: true
ignore_warnings: true
seed: 42
callbacks:
  model_summary:
    _target_: pytorch_lightning.callbacks.RichModelSummary
    max_depth: 2
  model_checkpoint:
    _target_: byprot.utils.callbacks.ModelCheckpoint
    monitor: val/loss
    mode: min
    save_top_k: 10
    save_last: true
    verbose: true
    dirpath: logs/dmlm_150m/checkpoints
    filename: step_{global_step}-loss_{val/loss:.2f}
    auto_insert_metric_name: false
    every_n_train_steps: 1000
    every_n_epochs: null
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val/loss
    mode: min
    patience: 1000
    min_delta: 0
    check_on_train_epoch_end: false
paths:
  root_dir: .
  data_dir: data-bin/crystalmols/tokens_mp_20
  log_dir: logs/dmlm_150m
  ckpt_dir: logs/dmlm_150m/checkpoints
datamodule:
  _target_: crystalmols_hf
  data_dir: data-bin/crystalmols/tokens_mp_20
  max_tokens: 40960
  max_len: 2048
  num_workers: 16
  special_tokens:
    pad_token: '[PAD]'
    unk_token: '[UNK]'
    bos_token: '[BOS]'
    eos_token: '[EOS]'
    mask_token: '[MASK]'
  tokenizer: crystallm
  vocab_file: data-bin/crystalmols/tokens_mp_20/meta.pkl
  format: cif_tokens
  vocab_size: 375
  batch_size: 16
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: cuda
  devices: auto
  min_epochs: 10
  max_epochs: 200
  enable_progress_bar: false
  log_every_n_steps: 10
  val_check_interval: 250
  check_val_every_n_epoch: null
  strategy: ddp_find_unused_parameters_true
  precision: bf16
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 0
  use_distributed_sampler: false
  max_steps: 50000
  accumulate_grad_batches: 4
  num_nodes: 1
project: DMLM_150m
model:
  _target_: dmlm
  num_diffusion_timesteps: 500
  gradient_ckpt: false
  rdm_couple: false
  lora:
    enable: false
    lora_rank: 16
    lora_dropout: 0.1
    lora_target_module: (esm.encoder.layer.[0-9]*.attention.(self.query|self.key|self.value|output.dense).*|esm.encoder.layer.[0-9]*.(intermediate|output).dense.*)
    modules_to_save: lm_head,esm.embeddings
  net:
    arch_type: esm_crystal
    name: facebook/esm2_t30_150M_UR50D
    dropout: 0.1
task:
  _target_: lm/dmlm
  learning:
    noise: random_mask
    watch_t1_t2_loss: false
    cal_constant_loss: false
    weight: linear
  criterion:
    _target_: byprot.modules.cross_entropy.RDMCrossEntropyLoss
    label_smoothing: 0.0
    ignore_index: 371
  optimizer:
    type: adamw
    _partial_: true
    lr: 0.001
    betas:
    - 0.9
    - 0.98
    weight_decay: 0.01
  lr_scheduler:
    type: polynomial
    warmup_steps: 100
    total_steps: 50000
    lr: 0.001
    lr_end: 0.0001
    warmup_init_lr: 1.0e-07
    power: 1